<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - TikTok Vitrine</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0d10; color: #fff; margin: 0; padding-bottom: 50px; }
        
        /* NAVBAR ESTILO PROMPT SHOP */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #11141a; padding: 15px 30px; border-bottom: 1px solid #1f232b; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: #1a1d24; border: 1px solid #2a2d35; color: #00f2fe; font-size: 20px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .brand h1 { margin: 0; font-size: 22px; color: #00f2fe; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }
        .brand p { margin: 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .nav-right { display: flex; align-items: center; }
        .profile-btn { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid #00f2fe; color: #fff; padding: 5px 15px 5px 5px; border-radius: 30px; text-decoration: none; transition: 0.3s; font-size: 14px; }
        .profile-btn:hover { background: rgba(0, 242, 254, 0.1); }
        .avatar { width: 30px; height: 30px; background: #00f2fe; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; font-size: 12px; }

        /* FORMULÁRIO DE ADIÇÃO */
        .container { max-width: 600px; margin: 40px auto; background: #161920; padding: 25px; border-radius: 12px; border: 1px solid #2a2d35; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .container h2 { margin-top: 0; color: #fff; font-size: 20px; text-align: center; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        input { background: #22252c; color: #fff; border: 1px solid #2a2d35; outline: none; }
        input:focus { border-color: #00f2fe; }
        button { background: #fe2c55; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #ff4d6d; box-shadow: 0 0 15px rgba(254, 44, 85, 0.4); }
        .preview-box { margin-top: 20px; text-align: center; display: none; background: #1a1d24; padding: 15px; border-radius: 8px; border: 1px solid #2a2d35; }
        .preview-box img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
        #btnSalvar { background: #00f2fe; color: #000; margin-top: 15px; }
        #btnSalvar:hover { background: #00e0ef; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }

        /* GRELHA DE VÍDEOS (CORES VIVAS) */
        .section-title { text-align: center; margin-top: 50px; font-size: 22px; color: #fff; border-top: 1px solid #1f232b; padding-top: 30px; letter-spacing: 1px; }
        .grid-vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card-video { background-color: #161920; border: 2px solid #2a2d35; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .card-video:hover { border-color: #9d4edd; box-shadow: 0 0 20px rgba(157, 78, 221, 0.3); transform: translateY(-5px); }
        .card-badge { position: absolute; top: 12px; left: 12px; background: #9d4edd; color: white; font-size: 11px; font-weight: 900; padding: 5px 10px; border-radius: 6px; z-index: 2; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card-img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-bottom: 1px solid #2a2d35; }
        .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: normal; color: #e0e0e0; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
        .card-btn { background: #1e88e5; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display: block; transition: 0.2s; text-transform: uppercase; }
        .card-btn:hover { background: #1565c0; box-shadow: 0 0 15px rgba(30, 136, 229, 0.5); }
    </style>
</head>
<body>

<!-- HEADER IGUAL AO PRINT -->
<header class="navbar">
    <div class="nav-left">
        <button class="menu-btn">☰</button>
        <div class="brand">
            <h1>TIKTOK VITRINE</h1>
            <p>Painel VIP de Produtos e Links</p>
        </div>
    </div>
    <div class="nav-right">
        <a href="#" class="profile-btn">
            <div class="avatar">ADM</div>
            <span>Markola</span>
        </a>
    </div>
</header>

<div class="container">
    <h2>Adicionar Novo Vídeo</h2>
    <label>Link do TikTok:</label>
    <input type="text" id="tiktokLink" placeholder="Cole o link do vídeo aqui...">
    
    <button id="btnProcessar">1. Gerar Prévia</button>

    <div class="preview-box" id="previewBox">
        <h3>Prévia Encontrada:</h3>
        <img id="thumbnailImg" src="" alt="Capa do Vídeo">
        <p id="videoTitle"></p>
        <button id="btnSalvar">2. Confirmar e Publicar</button>
    </div>
</div>

<h2 class="section-title">VÍDEOS PUBLICADOS</h2>
<div class="grid-vitrine" id="galeriaAdmin"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNjDRgCjgdLuwc5B4mipg4Jb6O5EOaU2k",
        authDomain: "tiktok-vitrine.firebaseapp.com",
        projectId: "tiktok-vitrine",
        storageBucket: "tiktok-vitrine.firebasestorage.app",
        messagingSenderId: "787606106856",
        appId: "1:787606106856:web:90fd64022f9ba1c3fdcf5d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let dadosParaSalvar = {};

    // Função Anti-Bloqueio (Intacta)
    document.getElementById('btnProcessar').addEventListener('click', async () => {
        const linkBruto = document.getElementById('tiktokLink').value;
        const btnProcessar = document.getElementById('btnProcessar');
        if (!linkBruto) { alert("Por favor, cole um link do TikTok."); return; }
        const link = linkBruto.split('?')[0];
        btnProcessar.innerText = "A procurar capa (Anti-Bloqueio)...";
        const apiUrl = `https://www.tikwm.com/api/?url=${link}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            if (data.code === 0 && data.data && data.data.cover) {
                document.getElementById('thumbnailImg').src = data.data.cover;
                document.getElementById('videoTitle').innerText = data.data.title;
                document.getElementById('previewBox').style.display = 'block';
                dadosParaSalvar = { linkOriginal: link, capa: data.data.cover, titulo: data.data.title, dataCriacao: new Date().toISOString() };
            } else {
                alert("O vídeo não foi encontrado. Pode ser privado ou ter restrições.");
            }
        } catch (error) {
            alert(`Falha ao comunicar com a API: ${error.message}`);
        } finally {
            btnProcessar.innerText = "1. Gerar Prévia";
        }
    });

    document.getElementById('btnSalvar').addEventListener('click', async () => {
        const btnSalvar = document.getElementById('btnSalvar');
        btnSalvar.innerText = "Salvando no sistema...";
        btnSalvar.disabled = true;
        try {
            await addDoc(collection(db, "videos"), dadosParaSalvar);
            alert("Sucesso! Vídeo publicado na sua vitrine.");
            document.getElementById('tiktokLink').value = "";
            document.getElementById('previewBox').style.display = "none";
            dadosParaSalvar = {};
            carregarVideos(); // Atualiza grelha
        } catch (e) {
            alert("Erro ao salvar. Verifique o banco de dados.");
        } finally {
            btnSalvar.innerText = "2. Confirmar e Publicar";
            btnSalvar.disabled = false;
        }
    });

    // Função de carregar a grelha visual
    async function carregarVideos() {
        const galeria = document.getElementById('galeriaAdmin');
        galeria.innerHTML = '<p style="text-align:center; width:100%; color:#00f2fe;">A carregar vídeos...</p>';
        try {
            const q = query(collection(db, "videos"), orderBy("dataCriacao", "desc"));
            const querySnapshot = await getDocs(q);
            galeria.innerHTML = '';
            if (querySnapshot.empty) {
                galeria.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">Nenhum vídeo publicado ainda.</p>';
                return;
            }
            querySnapshot.forEach((doc) => {
                const video = doc.data();
                galeria.innerHTML += `
                    <div class="card-video">
                        <div class="card-badge">VÍDEO TIKTOK</div>
                        <img class="card-img" src="${video.capa}" alt="Capa">
                        <div class="card-content">
                            <div class="card-title">${video.titulo || 'Ver vídeo'}</div>
                            <a class="card-btn" href="${video.linkOriginal}" target="_blank">📺 ASSISTIR</a>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            galeria.innerHTML = '<p style="text-align:center; width:100%; color:#fe2c55;">Erro ao carregar a grelha.</p>';
        }
    }
    carregarVideos();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel VIP - TikTok Vitrine</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0d10; color: #fff; margin: 0; padding-bottom: 50px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #11141a; padding: 15px 30px; border-bottom: 1px solid #1f232b; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: #1a1d24; border: 1px solid #2a2d35; color: #00f2fe; font-size: 20px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .brand h1 { margin: 0; font-size: 22px; color: #00f2fe; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }
        .brand p { margin: 0; font-size: 12px; color: #888; text-transform: uppercase; }
        
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .btn-novo { background: #fe2c55; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; text-transform: uppercase; }
        .btn-novo:hover { background: #ff4d6d; box-shadow: 0 0 15px rgba(254, 44, 85, 0.5); }
        .btn-redes { background: #1e88e5; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; text-transform: uppercase; }
        .btn-redes:hover { background: #1565c0; box-shadow: 0 0 15px rgba(30, 136, 229, 0.5); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-box { background: #161920; padding: 25px; border-radius: 12px; border: 1px solid #2a2d35; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
        .modal-box h2 { margin-top: 0; color: #00f2fe; font-size: 20px; text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #888; font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: #fe2c55; }
        
        input, button.form-btn { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        input { background: #22252c; color: #fff; border: 1px solid #2a2d35; outline: none; }
        input:focus { border-color: #00f2fe; }
        button.form-btn { background: #fe2c55; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button.form-btn:hover { background: #ff4d6d; }
        
        .preview-box { margin-top: 15px; text-align: center; display: none; background: #1a1d24; padding: 15px; border-radius: 8px; border: 1px solid #2a2d35; }
        .preview-box img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
        #btnSalvar, #btnSalvarEdicao { background: #00f2fe; color: #000; margin-top: 10px; }
        #btnSalvar:hover, #btnSalvarEdicao:hover { background: #00e0ef; }

        .section-title { text-align: center; margin-top: 30px; font-size: 22px; color: #fff; letter-spacing: 1px; }
        .grid-vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .card-video { background-color: #161920; border: 2px solid #2a2d35; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .card-img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-bottom: 1px solid #2a2d35; }
        .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 14px; color: #e0e0e0; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
        
        .admin-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
        .btn-action { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; color: #fff; text-transform: uppercase; }
        .btn-edit { background: #f39c12; } .btn-edit:hover { background: #e67e22; }
        .btn-delete { background: #e74c3c; } .btn-delete:hover { background: #c0392b; }
        .order-controls { display: flex; width: 100%; gap: 8px; margin-bottom: 8px; }
        .btn-order { flex: 1; background: #2a2d35; color: #fff; border: 1px solid #3a3d45; border-radius: 6px; padding: 6px; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn-order:hover { background: #00f2fe; color: #000; border-color: #00f2fe; }

        /* ========================================= */
        /* OTIMIZAÇÃO PARA CELULARES (MOBILE FIRST)  */
        /* ========================================= */
        @media (max-width: 768px) {
            .grid-vitrine {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px; 
                padding: 0 10px;
                margin: 20px auto;
            }
            .card-content { padding: 10px; }
            .card-badge { font-size: 8px; padding: 4px 6px; top: 8px; left: 8px; }
            .card-title { font-size: 11px; margin-bottom: 10px; -webkit-line-clamp: 3; }
            .card-btn { font-size: 10px; padding: 8px; }
            .admin-controls { gap: 4px; }
            .btn-action { font-size: 9px; padding: 6px 4px; }
            .order-controls { gap: 4px; margin-bottom: 6px; }
            .btn-order { font-size: 12px; padding: 4px; }
            .navbar { padding: 15px 10px; flex-wrap: wrap; justify-content: space-between; }
            .nav-left { gap: 10px; }
            .brand h1 { font-size: 16px; }
            .brand p { font-size: 10px; }
            .nav-right { gap: 5px; margin-top: 10px; width: 100%; justify-content: flex-end; }
            .btn-novo, .btn-redes { font-size: 10px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <button class="menu-btn">☰</button>
        <div class="brand">
            <h1>TIKTOK VITRINE</h1>
            <p>Painel VIP - Gestão</p>
        </div>
    </div>
    <div class="nav-right">
        <button class="btn-redes" onclick="abrirModalRedes()">Redes Sociais</button>
        <button class="btn-novo" onclick="abrirModalAdd()">+ Novo Vídeo</button>
    </div>
</header>

<h2 class="section-title">A TUA VITRINE (EDITÁVEL)</h2>
<div class="grid-vitrine" id="galeriaAdmin"></div>

<!-- MODAL: ADICIONAR VÍDEO -->
<div class="modal-overlay" id="modalAdd">
    <div class="modal-box">
        <button class="close-modal" onclick="fecharModalAdd()">✖</button>
        <h2>Adicionar Link</h2>
        <input type="text" id="tiktokLink" placeholder="Cole o link do TikTok aqui...">
        <button class="form-btn" id="btnProcessar">1. Gerar Prévia</button>

        <div class="preview-box" id="previewBox">
            <img id="thumbnailImg" src="" alt="Capa">
            <p id="videoTitle" style="font-size: 12px; color: #ccc;"></p>
            <button class="form-btn" id="btnSalvar">2. Confirmar e Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL: REDES SOCIAIS -->
<div class="modal-overlay" id="modalRedes">
    <div class="modal-box">
        <button class="close-modal" onclick="fecharModalRedes()">✖</button>
        <h2>Configurar Redes Sociais</h2>
        <label style="font-size: 12px; color: #888;">Link do Instagram:</label>
        <input type="text" id="linkInsta" placeholder="https://instagram.com/seu_perfil">
        <label style="font-size: 12px; color: #888;">Link do Facebook:</label>
        <input type="text" id="linkFace" placeholder="https://facebook.com/seu_perfil">
        <button class="form-btn" id="btnSalvarRedes" style="background: #00f2fe; color: #000; margin-top: 15px;">Salvar Redes Sociais</button>
    </div>
</div>

<!-- MODAL: EDITAR TÍTULO/LINK -->
<div class="modal-overlay" id="modalEdit">
    <div class="modal-box">
        <button class="close-modal" onclick="fecharModalEdit()">✖</button>
        <h2>Editar Vídeo</h2>
        <input type="hidden" id="editId">
        <label style="font-size: 12px; color: #888;">Título do Produto:</label>
        <input type="text" id="editTitulo">
        <label style="font-size: 12px; color: #888;">Link de Destino:</label>
        <input type="text" id="editLink">
        <button class="form-btn" id="btnSalvarEdicao">Guardar Alterações</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNjDRgCjgdLuwc5B4mipg4Jb6O5EOaU2k",
        authDomain: "tiktok-vitrine.firebaseapp.com",
        projectId: "tiktok-vitrine",
        storageBucket: "tiktok-vitrine.firebasestorage.app",
        messagingSenderId: "787606106856",
        appId: "1:787606106856:web:90fd64022f9ba1c3fdcf5d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let dadosParaSalvar = {};
    let listaVideos = [];

    window.abrirModalAdd = () => document.getElementById('modalAdd').style.display = 'flex';
    window.fecharModalAdd = () => {
        document.getElementById('modalAdd').style.display = 'none';
        document.getElementById('tiktokLink').value = "";
        document.getElementById('previewBox').style.display = "none";
    };

    window.abrirModalEdit = (id, titulo, link) => {
        document.getElementById('editId').value = id;
        document.getElementById('editTitulo').value = titulo;
        document.getElementById('editLink').value = link;
        document.getElementById('modalEdit').style.display = 'flex';
    };
    window.fecharModalEdit = () => document.getElementById('modalEdit').style.display = 'none';

    window.abrirModalRedes = async () => {
        document.getElementById('modalRedes').style.display = 'flex';
        const configSnap = await getDoc(doc(db, "config", "redes_sociais"));
        if (configSnap.exists()) {
            document.getElementById('linkInsta').value = configSnap.data().instagram || "";
            document.getElementById('linkFace').value = configSnap.data().facebook || "";
        }
    };
    window.fecharModalRedes = () => document.getElementById('modalRedes').style.display = 'none';

    document.getElementById('btnSalvarRedes').addEventListener('click', async () => {
        const insta = document.getElementById('linkInsta').value;
        const face = document.getElementById('linkFace').value;
        await setDoc(doc(db, "config", "redes_sociais"), { instagram: insta, facebook: face });
        alert("Redes Sociais salvas com sucesso!");
        fecharModalRedes();
    });

    document.getElementById('btnProcessar').addEventListener('click', async () => {
        const linkBruto = document.getElementById('tiktokLink').value;
        const btnProcessar = document.getElementById('btnProcessar');
        if (!linkBruto) { alert("Cola um link primeiro."); return; }
        
        const link = linkBruto.split('?')[0];
        btnProcessar.innerText = "A procurar...";
        
        try {
            const response = await fetch(`https://www.tikwm.com/api/?url=${link}`);
            const data = await response.json();
            if (data.code === 0 && data.data && data.data.cover) {
                document.getElementById('thumbnailImg').src = data.data.cover;
                document.getElementById('videoTitle').innerText = data.data.title;
                document.getElementById('previewBox').style.display = 'block';
                dadosParaSalvar = { 
                    linkOriginal: link, 
                    capa: data.data.cover, 
                    titulo: data.data.title, 
                    dataCriacao: new Date().getTime() 
                };
            } else {
                alert("Erro: O vídeo pode ser privado.");
            }
        } catch (error) {
            alert("Erro de comunicação com a API.");
        } finally {
            btnProcessar.innerText = "1. Gerar Prévia";
        }
    });

    document.getElementById('btnSalvar').addEventListener('click', async () => {
        try {
            await addDoc(collection(db, "videos"), dadosParaSalvar);
            fecharModalAdd();
            carregarVideos();
        } catch (e) {
            alert("Erro ao salvar no banco de dados.");
        }
    });

    async function carregarVideos() {
        const galeria = document.getElementById('galeriaAdmin');
        galeria.innerHTML = '<p style="text-align:center; color:#00f2fe;">A carregar sistema...</p>';
        try {
            const q = query(collection(db, "videos"), orderBy("dataCriacao", "asc"));
            const querySnapshot = await getDocs(q);
            galeria.innerHTML = '';
            listaVideos = [];
            
            if (querySnapshot.empty) {
                galeria.innerHTML = '<p style="text-align:center; color:#aaa;">Nenhum vídeo publicado ainda.</p>';
                return;
            }

            let index = 0;
            querySnapshot.forEach((doc) => {
                const video = doc.data();
                video.id = doc.id; 
                listaVideos.push(video);
                const safeTitulo = (video.titulo || '').replace(/"/g, "&quot;").replace(/'/g, "&#39;");

                galeria.innerHTML += `
                    <div class="card-video">
                        <img class="card-img" src="${video.capa}">
                        <div class="card-content">
                            <div class="card-title">${safeTitulo}</div>
                            <div class="order-controls">
                                <button class="btn-order" onclick="moverVideo(${index}, 'esquerda')" title="Mover para a esquerda">⬅️</button>
                                <button class="btn-order" onclick="moverVideo(${index}, 'direita')" title="Mover para a direita">➡️</button>
                            </div>
                            <div class="admin-controls">
                                <button class="btn-action btn-edit" onclick="abrirModalEdit('${video.id}', '${safeTitulo}', '${video.linkOriginal}')">✏️ Editar</button>
                                <button class="btn-action btn-delete" onclick="deletarVideo('${video.id}')">🗑️ Excluir</button>
                            </div>
                        </div>
                    </div>
                `;
                index++;
            });
        } catch (error) {
            galeria.innerHTML = '<p style="text-align:center; color:#fe2c55;">Erro ao carregar a grelha.</p>';
        }
    }

    window.deletarVideo = async (id) => {
        if(confirm("Tens a certeza que queres excluir este vídeo da vitrine?")) {
            await deleteDoc(doc(db, "videos", id));
            carregarVideos();
        }
    };

    document.getElementById('btnSalvarEdicao').addEventListener('click', async () => {
        const id = document.getElementById('editId').value;
        const novoTitulo = document.getElementById('editTitulo').value;
        const novoLink = document.getElementById('editLink').value;
        await updateDoc(doc(db, "videos", id), { titulo: novoTitulo, linkOriginal: novoLink });
        fecharModalEdit();
        carregarVideos();
    });

    window.moverVideo = async (indexAtual, direcao) => {
        let indexAlvo = direcao === 'esquerda' ? indexAtual - 1 : indexAtual + 1;
        if (indexAlvo >= 0 && indexAlvo < listaVideos.length) {
            const videoAtual = listaVideos[indexAtual];
            const videoAlvo = listaVideos[indexAlvo];
            const tempDate = videoAtual.dataCriacao;
            await updateDoc(doc(db, "videos", videoAtual.id), { dataCriacao: videoAlvo.dataCriacao });
            await updateDoc(doc(db, "videos", videoAlvo.id), { dataCriacao: tempDate });
            carregarVideos();
        }
    };

    carregarVideos();
</script>
</body>
</html>

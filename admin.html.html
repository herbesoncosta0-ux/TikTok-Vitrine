<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - Links TikTok</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #333; color: #fff; }
        button { background: #fe2c55; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #e0264b; }
        .preview-box { margin-top: 20px; text-align: center; display: none; }
        .preview-box img { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Adicionar Novo Vídeo</h2>
    <label>Link do TikTok:</label>
    <input type="text" id="tiktokLink" placeholder="Cole o link do vídeo aqui...">
    
    <button onclick="processarLink()">Gerar Prévia e Salvar</button>

    <div class="preview-box" id="previewBox">
        <h3>Prévia Gerada:</h3>
        <img id="thumbnailImg" src="" alt="Capa do Vídeo">
        <p id="videoTitle"></p>
        <button onclick="salvarNoFirebase()" style="background: #00f2fe; color: #000;">Confirmar e Publicar</button>
    </div>
</div>

<!-- Scripts do Firebase entrarão aqui depois -->

<script>
    let dadosParaSalvar = {};

    async function processarLink() {
        const link = document.getElementById('tiktokLink').value;
        if (!link) {
            alert("Por favor, cole um link do TikTok.");
            return;
        }

        // Usamos um proxy (allorigins) para evitar bloqueios de CORS ao buscar dados direto do navegador
        const oembedUrl = `https://www.tiktok.com/oembed?url=${encodeURIComponent(link)}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(oembedUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            const data = await response.json();
            
            // O conteúdo real vem em formato de string dentro de 'contents', precisamos converter
            const tiktokData = JSON.parse(data.contents);

            if (tiktokData.thumbnail_url) {
                // Preenchendo a tela com a prévia
                document.getElementById('thumbnailImg').src = tiktokData.thumbnail_url;
                document.getElementById('videoTitle').innerText = tiktokData.title;
                document.getElementById('previewBox').style.display = 'block';

                // Guardando os dados para enviar ao Firebase no próximo passo
                dadosParaSalvar = {
                    linkOriginal: link,
                    capa: tiktokData.thumbnail_url,
                    titulo: tiktokData.title,
                    dataCriacao: new Date().toISOString()
                };
            } else {
                alert("Não foi possível carregar a prévia. Verifique se o link está correto e é público.");
            }
        } catch (error) {
            console.error("Erro ao buscar dados do TikTok:", error);
            alert("Erro ao gerar a prévia.");
        }
    }

    function salvarNoFirebase() {
        // Aqui vai entrar a função de salvar no Firestore
        console.log("Dados prontos para o banco de dados:", dadosParaSalvar);
        alert("Configuração do Firebase em andamento! Dados no console.");
    }
</script>

</body>
</html>

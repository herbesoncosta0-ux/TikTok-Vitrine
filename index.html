<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine do Markola</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0d10; color: #fff; margin: 0; padding-bottom: 50px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #11141a; padding: 15px 30px; border-bottom: 1px solid #1f232b; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: #1a1d24; border: 1px solid #2a2d35; color: #00f2fe; font-size: 20px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .brand h1 { margin: 0; font-size: 22px; color: #00f2fe; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }
        .brand p { margin: 0; font-size: 12px; color: #888; text-transform: uppercase; }
        
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .social-link { background: #1a1d24; color: #fff; border: 1px solid #2a2d35; padding: 8px 15px; border-radius: 30px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; display: none; }
        .social-link:hover { border-color: #00f2fe; color: #00f2fe; }

        .grid-vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .card-video { background-color: #161920; border: 2px solid #2a2d35; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .card-video:hover { border-color: #fe2c55; box-shadow: 0 0 20px rgba(254, 44, 85, 0.3); transform: translateY(-5px); }
        .card-badge { position: absolute; top: 12px; left: 12px; background: #fe2c55; color: white; font-size: 11px; font-weight: 900; padding: 5px 10px; border-radius: 6px; z-index: 2; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card-img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-bottom: 1px solid #2a2d35; }
        .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: normal; color: #e0e0e0; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
        .card-btn { background: #00f2fe; color: #000; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display: block; transition: 0.2s; text-transform: uppercase; }
        .card-btn:hover { background: #00e0ef; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }

        /* PAGINAÇÃO */
        .pagination-controls { display: flex; justify-content: center; gap: 10px; margin: 30px auto; flex-wrap: wrap; max-width: 1200px; padding: 0 20px; }
        .page-btn { background: #161920; color: #fff; border: 1px solid #2a2d35; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .page-btn:hover { border-color: #00f2fe; color: #00f2fe; }
        .page-btn.active { background: #00f2fe; color: #000; border-color: #00f2fe; }

        /* OTIMIZAÇÃO PARA CELULARES */
        @media (max-width: 768px) {
            .grid-vitrine { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; margin: 20px auto; }
            .card-content { padding: 10px; }
            .card-badge { font-size: 8px; padding: 4px 6px; top: 8px; left: 8px; }
            .card-title { font-size: 11px; margin-bottom: 10px; -webkit-line-clamp: 3; }
            .card-btn { font-size: 10px; padding: 8px; }
            .navbar { padding: 15px 10px; flex-wrap: wrap; justify-content: space-between; }
            .nav-left { gap: 10px; }
            .brand h1 { font-size: 16px; }
            .brand p { font-size: 10px; }
            .nav-right { gap: 5px; margin-top: 10px; width: 100%; justify-content: flex-end; }
            .social-link { font-size: 10px; padding: 8px 12px; }
            .page-btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <button class="menu-btn">☰</button>
        <div class="brand">
            <h1>TIKTOK VITRINE</h1>
            <p>Os Melhores Produtos e Links</p>
        </div>
    </div>
    <div class="nav-right">
        <a href="#" target="_blank" class="social-link" id="btnInsta">Instagram</a>
        <a href="#" target="_blank" class="social-link" id="btnFace">Facebook</a>
        <a href="#" target="_blank" class="social-link" id="btnTiktok">TikTok</a>
    </div>
</header>

<div class="grid-vitrine" id="galeriaPublica"></div>
<div class="pagination-controls" id="paginationPublic"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNjDRgCjgdLuwc5B4mipg4Jb6O5EOaU2k",
        authDomain: "tiktok-vitrine.firebaseapp.com",
        projectId: "tiktok-vitrine",
        storageBucket: "tiktok-vitrine.firebasestorage.app",
        messagingSenderId: "787606106856",
        appId: "1:787606106856:web:90fd64022f9ba1c3fdcf5d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let listaVideos = [];
    
    // Variáveis de Paginação
    let currentPage = 1;
    const itemsPerPage = 20;

    async function carregarRedesSociais() {
        const configSnap = await getDoc(doc(db, "config", "redes_sociais"));
        if (configSnap.exists()) {
            const dados = configSnap.data();
            if (dados.instagram) {
                const btnInsta = document.getElementById('btnInsta');
                btnInsta.href = dados.instagram;
                btnInsta.style.display = 'inline-block';
            }
            if (dados.facebook) {
                const btnFace = document.getElementById('btnFace');
                btnFace.href = dados.facebook;
                btnFace.style.display = 'inline-block';
            }
            if (dados.tiktok) {
                const btnTiktok = document.getElementById('btnTiktok');
                btnTiktok.href = dados.tiktok;
                btnTiktok.style.display = 'inline-block';
            }
        }
    }
    carregarRedesSociais();

    async function carregarVideos() {
        try {
            const q = query(collection(db, "videos"), orderBy("dataCriacao", "asc"));
            const querySnapshot = await getDocs(q);
            listaVideos = [];
            querySnapshot.forEach((doc) => {
                const video = doc.data();
                listaVideos.push(video);
            });
            renderizarGrelha();
        } catch (error) {
            document.getElementById('galeriaPublica').innerHTML = '<p style="text-align:center; color:#fe2c55;">Erro ao carregar a vitrine.</p>';
        }
    }

    function renderizarGrelha() {
        const galeria = document.getElementById('galeriaPublica');
        const pagination = document.getElementById('paginationPublic');
        galeria.innerHTML = '';
        pagination.innerHTML = '';

        if (listaVideos.length === 0) {
            galeria.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">Nenhum produto publicado ainda.</p>';
            return;
        }

        const totalPages = Math.ceil(listaVideos.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const videosParaExibir = listaVideos.slice(startIndex, endIndex);

        videosParaExibir.forEach((video) => {
            galeria.innerHTML += `
                <div class="card-video">
                    <div class="card-badge">OFERTA TIKTOK</div>
                    <img class="card-img" src="${video.capa}" alt="Capa">
                    <div class="card-content">
                        <div class="card-title">${video.titulo || 'Ver vídeo do produto'}</div>
                        <a class="card-btn" href="${video.linkOriginal}" target="_blank">🛒 COMPRAR / ASSISTIR</a>
                    </div>
                </div>
            `;
        });

        if (totalPages > 1) {
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
            }
        }
    }

    window.mudarPagina = (page) => {
        currentPage = page;
        renderizarGrelha();
        window.scrollTo({ top: document.getElementById('galeriaPublica').offsetTop - 20, behavior: 'smooth' });
    };

    carregarVideos();
</script>

</body>
</html>
